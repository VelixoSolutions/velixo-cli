# Both CLI samples in one Fly.io app: the inventory checker at /, the expense receipts demos at /acumatica/ and
# /sageintacct/. Fly's GitHub integration deploys it from this folder; DEPLOY.md sets it up.
app = "velixo-cli-samples"
primary_region = "iad"

# The CLI's sign-in and the apps' state live here. The CLI replaces its refresh token on every call, so losing this
# disk signs every sample out.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
