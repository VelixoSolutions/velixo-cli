name: Release

on:
  push:
    tags: ['v*']
  # A dry run: builds, signs and packages every target from the branch it is started on, and
  # publishes nothing. Use it to check signing before tagging a release.
  workflow_dispatch:
    inputs:
      allow-unsigned:
        description: Build without signing the targets whose signing keys are not set up yet.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Velixo.Cli.slnx
  MAIN_PROJECT: src/Velixo.Cli/Velixo.Cli.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ${{ env.SOLUTION }}
      - run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror
      - run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

  publish:
    needs: test
    name: publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
            smoke: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            smoke: true
          - rid: linux-musl-x64
            os: ubuntu-latest
            archive: tar.gz
            smoke: true
            # Built inside the Alpine NativeAOT SDK image, so the binary links against musl.
            container: mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot
          - rid: osx-arm64
            os: macos-15
            archive: tar.gz
            smoke: true
          - rid: osx-x64
            os: macos-15-intel
            archive: tar.gz
            smoke: true
          - rid: win-x64
            os: windows-latest
            archive: zip
            smoke: true
          - rid: win-arm64
            os: windows-latest
            archive: zip
            # Cross-compiled on an x64 runner, so the binary cannot run here.
            smoke: false
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      # Signing is required: a target whose keys are missing fails the release, unless the repository
      # variable VELIXO_ALLOW_UNSIGNED is true (or a dry run ticks allow-unsigned), which ships that
      # target unsigned with a warning. Set it only until the keys exist, then delete it.
      ALLOW_UNSIGNED: ${{ vars.VELIXO_ALLOW_UNSIGNED == 'true' || inputs.allow-unsigned == true }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
            echo "VERSION=$version-dryrun.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v6
        if: ${{ !matrix.container }}
        with:
          dotnet-version: 10.0.x

      - name: Install the NativeAOT toolchain (Linux)
        if: ${{ startsWith(matrix.rid, 'linux-') && !matrix.container }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish with NativeAOT
        if: ${{ !matrix.container }}
        run: >
          dotnet publish "$MAIN_PROJECT" -c Release -r "$RID"
          -p:PublishAot=true -p:Version="$VERSION"
          -o "publish/$RID"

      - name: Publish with NativeAOT (Alpine container)
        if: ${{ matrix.container }}
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          -e RID -e VERSION -e MAIN_PROJECT
          ${{ matrix.container }}
          sh -c 'dotnet publish "$MAIN_PROJECT" -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" -o "publish/$RID"'

      # Windows: Authenticode-sign velixo.exe with the Velixo EV certificate, which lives in Azure
      # Key Vault, before it is smoke-tested, archived and checksummed. Same tool, version and
      # certificate as the Velixo Classic pipeline and Velixo-NextGen's Business Central extension.
      # .github/code-signing.json names the certificate; it mirrors build-scripts/code-signing.json
      # in Velixo-NextGen, so a certificate rotation updates both. The client secret is the
      # organization secret VELIXO_AZURE_KEY_VAULT_CLIENT_SECRET, which this repository must be
      # given access to. A release is never published unsigned: without the secret the job fails.
      - name: Install AzureSignTool (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: dotnet tool install --global AzureSignTool --version 3.0.0

      - name: Sign velixo.exe (Windows)
        id: windows-signing
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        env:
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.VELIXO_AZURE_KEY_VAULT_CLIENT_SECRET }}
          # AzureSignTool 3.0.0 targets an older .NET than the one setup-dotnet installs.
          DOTNET_ROLL_FORWARD: Major
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrEmpty($env:AZURE_KEY_VAULT_CLIENT_SECRET)) {
              if ($env:ALLOW_UNSIGNED -eq 'true') {
                  Write-Output "::warning::velixo.exe for $env:RID is NOT signed: VELIXO_AZURE_KEY_VAULT_CLIENT_SECRET is not available to this repository, and VELIXO_ALLOW_UNSIGNED is true."
                  "signed=false" >> $env:GITHUB_OUTPUT
                  exit 0
              }

              throw 'Refusing to ship unsigned: the secret VELIXO_AZURE_KEY_VAULT_CLIENT_SECRET is not available to this repository. Share it with this repository, or set the repository variable VELIXO_ALLOW_UNSIGNED to true to ship unsigned for now.'
          }

          $signing = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE '.github/code-signing.json') | ConvertFrom-Json
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/$env:RID/velixo.exe"

          azuresigntool sign `
              --azure-key-vault-url $signing.keyVaultUrl `
              --azure-key-vault-certificate $signing.certificateName `
              --azure-key-vault-tenant-id $signing.tenantId `
              --azure-key-vault-client-id $signing.clientId `
              --azure-key-vault-client-secret $env:AZURE_KEY_VAULT_CLIENT_SECRET `
              --timestamp-rfc3161 $signing.timestampUrl `
              --timestamp-digest sha256 `
              --file-digest sha256 `
              --description 'Velixo CLI' `
              --description-url 'https://cli.velixo.com' `
              $exe

          if ($LASTEXITCODE -ne 0) {
              throw "azuresigntool exited with $LASTEXITCODE"
          }

          "signed=true" >> $env:GITHUB_OUTPUT

      # A zero exit code says the tool ran, not that the result verifies. Ask Windows whether the
      # signature velixo.exe now carries is valid and timestamped. An ARM64 executable verifies on
      # this x64 runner: verifying reads the signature, it does not run the file.
      - name: Verify the signature (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') && steps.windows-signing.outputs.signed == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $signature = Get-AuthenticodeSignature (Join-Path $env:GITHUB_WORKSPACE "publish/$env:RID/velixo.exe")
          Write-Host "Status:    $($signature.Status)"
          Write-Host "Subject:   $($signature.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($signature.TimeStamperCertificate.Subject)"

          if ($signature.Status -ne 'Valid') {
              throw "velixo.exe is not validly signed: $($signature.Status) -- $($signature.StatusMessage)"
          }

          if ($null -eq $signature.TimeStamperCertificate) {
              throw 'velixo.exe is signed without a timestamp, so its signature would expire with the certificate.'
          }

      # macOS: sign velixo with the Velixo Developer ID Application certificate and the hardened
      # runtime, then notarize it with Apple. NativeAOT generates no code at run time, so the binary
      # needs no entitlements. A bare binary cannot carry a stapled ticket: Gatekeeper checks the
      # notarization online the first time it sees the file. The secrets:
      #   APPLE_CERTIFICATE_P12_BASE64  the Developer ID Application certificate and its key, as a .p12, in base64
      #   APPLE_CERTIFICATE_PASSWORD    the .p12's password
      #   APPLE_API_KEY_ID              an App Store Connect API key's id (a Team key, Developer role)
      #   APPLE_API_ISSUER_ID           that key's issuer id
      #   APPLE_API_KEY_P8_BASE64       that key's .p8 file, in base64
      - name: Sign and notarize velixo (macOS)
        id: macos-signing
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          missing=""
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::velixo for $RID is NOT signed or notarized: missing secrets$missing, and VELIXO_ALLOW_UNSIGNED is true."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Refusing to ship unsigned: missing secrets$missing. Add them, or set the repository variable VELIXO_ALLOW_UNSIGNED to true to ship unsigned for now."
            exit 1
          fi

          # A keychain of the job's own, so the certificate never touches the runner's login keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::The .p12 holds no Developer ID Application certificate."
            exit 1
          fi
          echo "Signing as: $identity"

          binary="publish/$RID/velixo"
          codesign --force --options runtime --timestamp --identifier com.velixo.cli --sign "$identity" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # Notarize: Apple takes a zip, pkg or dmg, so the binary goes up zipped and ships as it is.
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/velixo-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/velixo-notarize.zip" \
            --key "$RUNNER_TEMP/api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notarization.json"
          rm -f "$RUNNER_TEMP/api-key.p8"

          status=$(sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notarization.json" | head -n 1)
          if [ "$status" != "Accepted" ]; then
            echo "::error::Apple did not accept the notarization: $status. The log: xcrun notarytool log <id> with the same key."
            exit 1
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the signing keychain (macOS)
        if: ${{ always() && startsWith(matrix.rid, 'osx-') }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Smoke test the binary
        if: ${{ matrix.smoke && !matrix.container }}
        run: |
          exe="publish/$RID/velixo"
          if [ "${RID#win-}" != "$RID" ]; then exe="$exe.exe"; fi
          "./$exe" --version | grep -F "$VERSION"
          "./$exe" help --all --output json > /dev/null

      - name: Smoke test the binary (Alpine container)
        if: ${{ matrix.smoke && matrix.container }}
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          -e RID -e VERSION
          ${{ matrix.container }}
          sh -c './publish/$RID/velixo --version | grep -F "$VERSION" && ./publish/$RID/velixo help --all --output json > /dev/null'

      - name: Package the binary
        run: |
          name="velixo-$VERSION-$RID"
          stage="stage/$name"
          mkdir -p "$stage" dist
          if [ "${RID#win-}" != "$RID" ]; then
            cp "publish/$RID/velixo.exe" "$stage/"
          else
            cp "publish/$RID/velixo" "$stage/"
            chmod 755 "$stage/velixo"
          fi
          cp LICENSE README.md "$stage/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$name.zip" ./* > /dev/null)
          else
            tar -czf "dist/$name.tar.gz" -C "$stage" .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: velixo-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: publish
    # A dry run (workflow_dispatch) stops after the signed packages are built and uploaded as artifacts.
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: velixo-*
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum velixo-* > checksums.txt
          cat checksums.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            $flags
