name: Deploy samples

# Deploys both CLI samples to one Fly.io app when either sample changes on main. The `samples` GitHub environment holds
# the Fly token and every setting, each as a secret or a variable; samples/DEPLOY.md lists them.

on:
    push:
        branches: [main]
        paths:
            - samples/**
            - .github/workflows/deploy-samples.yml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-samples
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: samples
        env:
            FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
            FLY_APP: ${{ vars.FLY_APP }}
            KIOSK_PASSWORD: ${{ secrets.KIOSK_PASSWORD || vars.KIOSK_PASSWORD }}
            KIOSK_CONNECTION: ${{ secrets.KIOSK_CONNECTION || vars.KIOSK_CONNECTION }}
            KIOSK_WAREHOUSE: ${{ secrets.KIOSK_WAREHOUSE || vars.KIOSK_WAREHOUSE }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || vars.OPENROUTER_API_KEY }}
            ACUMATICA_CONNECTION: ${{ secrets.ACUMATICA_CONNECTION || vars.ACUMATICA_CONNECTION }}
            ACUMATICA_URL: ${{ secrets.ACUMATICA_URL || vars.ACUMATICA_URL }}
            ACUMATICA_COMPANY: ${{ secrets.ACUMATICA_COMPANY || vars.ACUMATICA_COMPANY }}
            SAGEINTACCT_CONNECTION: ${{ secrets.SAGEINTACCT_CONNECTION || vars.SAGEINTACCT_CONNECTION }}
            SAGE_EXPENSE_URL_TEMPLATE: ${{ secrets.SAGE_EXPENSE_URL_TEMPLATE || vars.SAGE_EXPENSE_URL_TEMPLATE }}
            TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || vars.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || vars.TWILIO_AUTH_TOKEN }}
            ACUMATICA_TWILIO_FROM_NUMBER: ${{ secrets.ACUMATICA_TWILIO_FROM_NUMBER || vars.ACUMATICA_TWILIO_FROM_NUMBER }}
            SAGEINTACCT_TWILIO_FROM_NUMBER: ${{ secrets.SAGEINTACCT_TWILIO_FROM_NUMBER || vars.SAGEINTACCT_TWILIO_FROM_NUMBER }}
            ACUMATICA_TELEGRAM_BOT_TOKEN: ${{ secrets.ACUMATICA_TELEGRAM_BOT_TOKEN || vars.ACUMATICA_TELEGRAM_BOT_TOKEN }}
            SAGEINTACCT_TELEGRAM_BOT_TOKEN: ${{ secrets.SAGEINTACCT_TELEGRAM_BOT_TOKEN || vars.SAGEINTACCT_TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET || vars.TELEGRAM_WEBHOOK_SECRET }}
            SETTINGS: >-
                KIOSK_PASSWORD KIOSK_CONNECTION KIOSK_WAREHOUSE OPENROUTER_API_KEY
                ACUMATICA_CONNECTION ACUMATICA_URL ACUMATICA_COMPANY SAGEINTACCT_CONNECTION SAGE_EXPENSE_URL_TEMPLATE
                TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN ACUMATICA_TWILIO_FROM_NUMBER SAGEINTACCT_TWILIO_FROM_NUMBER
                ACUMATICA_TELEGRAM_BOT_TOKEN SAGEINTACCT_TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET
        steps:
            - uses: actions/checkout@v4

            - name: Decide whether to deploy
              id: decide
              run: |
                  skip() { echo "::notice title=Samples not deployed::$1"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
                  for folder in samples/inventorychecker samples/expensereceipts; do
                    [ -d "$folder" ] || skip "$folder is not on this branch yet."
                  done
                  [ -n "$FLY_API_TOKEN" ] || skip "The samples environment has no FLY_API_TOKEN; samples/DEPLOY.md sets it."
                  # The kiosk can reserve stock, so it never goes on the internet without a password.
                  [ -n "$KIOSK_PASSWORD" ] || skip "The samples environment has no KIOSK_PASSWORD; samples/DEPLOY.md says why it is required."
                  echo "deploy=true" >> "$GITHUB_OUTPUT"

            - uses: superfly/flyctl-actions/setup-flyctl@master
              if: steps.decide.outputs.deploy == 'true'

            - name: Send the settings to Fly
              if: steps.decide.outputs.deploy == 'true'
              run: |
                  app_flag=(); [ -n "$FLY_APP" ] && app_flag=(--app "$FLY_APP")
                  pairs=()
                  for name in $SETTINGS; do
                    [ -n "${!name}" ] && pairs+=("$name=${!name}")
                  done
                  flyctl secrets set --stage "${app_flag[@]}" --config samples/fly.toml "${pairs[@]}" > /dev/null

            - name: Deploy
              if: steps.decide.outputs.deploy == 'true'
              run: |
                  app_flag=(); [ -n "$FLY_APP" ] && app_flag=(--app "$FLY_APP")
                  flyctl deploy samples --config samples/fly.toml "${app_flag[@]}" --remote-only --ha=false
