name: Package managers

# Publishes a GitHub Release of the CLI to Homebrew, WinGet and npm. The Release workflow calls it after
# it publishes a release. Run it by hand (Actions, Package managers, Run workflow) with a tag to
# publish a release that is already out, such as one published before this workflow existed.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, such as v1.0.2.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v1.0.2.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Homebrew: the formula is Formula/velixo.rb in this repository, which is its own tap:
  #   brew tap velixosolutions/velixo-cli https://github.com/VelixoSolutions/velixo-cli
  #   brew install velixo
  # The job writes the formula from the release's checksums.txt, installs the CLI with it from a tap
  # of this checkout, and commits it to main.
  homebrew:
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Write the formula
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"
          mkdir -p Formula
          scripts/homebrew-formula.sh "$version" "$RUNNER_TEMP/checksums.txt" > Formula/velixo.rb
          cat Formula/velixo.rb

      - name: Commit the formula
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/velixo.rb && git ls-files --error-unmatch Formula/velixo.rb > /dev/null 2>&1; then
            echo "Formula/velixo.rb is already at ${TAG#v}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/velixo.rb
          git commit -m "Homebrew: velixo ${TAG#v}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Tapping the local checkout installs exactly the committed formula, before anyone else sees it.
      - name: Install with Homebrew and run velixo
        run: |
          set -euo pipefail
          brew tap velixosolutions/velixo-cli "$GITHUB_WORKSPACE"
          brew install velixosolutions/velixo-cli/velixo
          velixo --version | grep -F "${TAG#v}"
          brew test velixosolutions/velixo-cli/velixo

      - name: Remove the test tap
        if: ${{ always() }}
        run: brew untap velixosolutions/velixo-cli 2>/dev/null || true

      - name: Push the formula
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: git push origin HEAD:main

  # WinGet: the package Velixo.CLI lives in microsoft/winget-pkgs. Komac, through winget-releaser,
  # opens a pull request there with the new version; Microsoft's checks merge it.
  #   WINGET_TOKEN  a classic GitHub token with public_repo, whose owner has a fork of
  #                 microsoft/winget-pkgs. A fine-grained token cannot open the pull request.
  # The first version goes in by hand (wingetcreate new): until Microsoft accepts it, Komac has no
  # package to update, so the job skips with a warning.
  winget:
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check the token and the package
        id: ready
        run: |
          set -euo pipefail
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WinGet is skipped: the secret WINGET_TOKEN is not available to this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $WINGET_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/v/Velixo/CLI)
          if [ "$status" != "200" ]; then
            echo "::warning::WinGet is skipped: Velixo.CLI is not in microsoft/winget-pkgs yet (HTTP $status). Submit the first version by hand with wingetcreate."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: vedantmgoyal9/winget-releaser@v2
        if: ${{ steps.ready.outputs.ready == 'true' }}
        with:
          identifier: Velixo.CLI
          release-tag: ${{ inputs.tag }}
          installers-regex: '-win-(x64|arm64)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  # npm: @velixo/cli, a launcher that runs the binary from one of seven platform packages,
  # @velixo/cli-<platform>, which npm installs by os, cpu and libc. scripts/npm-packages.mjs builds
  # them from the release's archives. A version already on the registry is skipped, so a rerun
  # publishes what is missing.
  #   NPM_TOKEN  an npm granular access token that can publish to the @velixo scope
  # Without it, the job skips with a warning.
  npm:
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Provenance links each package to this workflow run; npm accepts it only from a public repository.
      PROVENANCE: ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}
    steps:
      - name: Check the token
        id: ready
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::npm is skipped: the secret NPM_TOKEN is not available to this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.ready.outputs.ready == 'true' }}

      - uses: actions/setup-node@v6
        if: ${{ steps.ready.outputs.ready == 'true' }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build the packages
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'velixo-*' --dir "$RUNNER_TEMP/dist"
          node scripts/npm-packages.mjs "${TAG#v}" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/npm"

      # The platform packages first: @velixo/cli must not reach the registry before what it installs.
      - name: Publish
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for dir in "$RUNNER_TEMP"/npm/cli-* "$RUNNER_TEMP/npm/cli"; do
            name=$(node -p "require('$dir/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published."
              continue
            fi
            (cd "$dir" && npm publish --access public $PROVENANCE)
          done
