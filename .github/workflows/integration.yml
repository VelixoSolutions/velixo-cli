name: Integration

# The CLI against a live Velixo environment: the NativeAOT binary, signed in with a refresh token.
#
# The gateway rotates a refresh token on every use and ends the session when a used one comes back, so
# the token cannot sit still in a secret. Each run reads VELIXO_IT_TOKEN, lets the CLI rotate it, and
# saves the rotated token back into the secret. Runs never overlap (concurrency below). A gateway
# session also ends after 30 days whatever happens, so the token needs seeding again about monthly.
#
# Before the tests, the run checks the sign-in. When the session has ended, no test runs, and the card in
# Teams says to seed the token again.
#
# A test that fails on a timeout, such as HTTP 524 from a slow ERP, runs once more (scripts/live-tests.sh).
#
# Seed it (and again whenever a run says the session ended):
#   velixo login --profile it --env nx-dev
#   velixo auth token --profile it | gh secret set VELIXO_IT_TOKEN
#   then never use the profile 'it' again: the run owns that session now.
#
# Settings:
#   secrets.VELIXO_IT_TOKEN          the refresh token, rewritten by every run
#   secrets.VELIXO_IT_SECRETS_TOKEN  a fine-grained token with "Secrets: read and write" on this repository,
#                                    to save the rotated token
#   vars.VELIXO_IT_ENV               the environment, such as nx-dev
#   vars.VELIXO_IT_CONNECTION        the Acumatica connection, gab-dev: the reads, the imports, and on-hold
#                                    AP bills for the vendor VELIXOIT that the tests create and delete
#   vars.VELIXO_IT_SAGE_CONNECTION   the Sage Intacct connection (default skyline): the tests also create
#                                    and delete a draft AP bill for the vendor VELIXOIT on it
#   vars.VELIXO_IT_BC_CONNECTION     the Business Central connection (default bc-dev): the tests also create
#                                    and delete an unposted purchase invoice for the vendor VELIXOIT on it
#   The token's user must see all three connections: share them with the organization.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VELIXO_IT_ENV: ${{ vars.VELIXO_IT_ENV }}
  VELIXO_IT_CONNECTION: ${{ vars.VELIXO_IT_CONNECTION }}
  VELIXO_IT_SAGE_CONNECTION: ${{ vars.VELIXO_IT_SAGE_CONNECTION }}
  VELIXO_IT_BC_CONNECTION: ${{ vars.VELIXO_IT_BC_CONNECTION }}
  VELIXO_IT_CONFIG_DIR: ${{ github.workspace }}/../velixo-it-config

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sign-in-ended: ${{ steps.sign-in.outputs.ended }}
    steps:
      - name: Check the settings
        env:
          TOKEN: ${{ secrets.VELIXO_IT_TOKEN }}
          SECRETS_TOKEN: ${{ secrets.VELIXO_IT_SECRETS_TOKEN }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing secrets.VELIXO_IT_TOKEN"
          [ -n "$SECRETS_TOKEN" ] || missing="$missing secrets.VELIXO_IT_SECRETS_TOKEN"
          [ -n "$VELIXO_IT_ENV" ] || missing="$missing vars.VELIXO_IT_ENV"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing. See the comment at the top of .github/workflows/integration.yml."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build
        run: dotnet build tests/Velixo.Cli.IntegrationTests -c Release -warnaserror

      - name: Publish with NativeAOT (linux-x64)
        run: dotnet publish src/Velixo.Cli -c Release -r linux-x64 -p:PublishAot=true -o out

      # Signs in as the tests do, so they continue from the token this step rotates.
      - name: Check the sign-in
        id: sign-in
        env:
          VELIXO_TOKEN: ${{ secrets.VELIXO_IT_TOKEN }}
          VELIXO_CLIENT_ID: velixo-cli
        run: |
          status=0
          VELIXO_CONFIG_DIR="$VELIXO_IT_CONFIG_DIR" ./out/velixo connections list --env "$VELIXO_IT_ENV" --output json --non-interactive > /dev/null || status=$?
          if [ "$status" -eq 4 ]; then
            echo "ended=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Sign-in ended::The sign-in of the live tests on $VELIXO_IT_ENV has ended, so no test ran. Seed secrets.VELIXO_IT_TOKEN again, as the header of .github/workflows/integration.yml says."
          fi
          exit "$status"

      - name: Run the live tests
        id: live
        env:
          VELIXO_IT_TOKEN: ${{ secrets.VELIXO_IT_TOKEN }}
          VELIXO_IT_BINARY: ${{ github.workspace }}/out/velixo
        run: scripts/live-tests.sh "$RUNNER_TEMP/live-test-results"

      # Runs even when a test failed: the token was rotated all the same, and the old one is now spent.
      - name: Save the rotated token
        if: always() && steps.sign-in.outcome != 'skipped' && steps.sign-in.outputs.ended != 'true'
        env:
          GH_TOKEN: ${{ secrets.VELIXO_IT_SECRETS_TOKEN }}
        run: |
          if [ ! -f "$VELIXO_IT_CONFIG_DIR/credentials.json" ]; then
            echo "No sign-in was stored, so the token was not used; nothing to save."
            exit 0
          fi
          token=$(VELIXO_CONFIG_DIR="$VELIXO_IT_CONFIG_DIR" ./out/velixo auth token --env "$VELIXO_IT_ENV")
          echo "::add-mask::$token"
          gh secret set VELIXO_IT_TOKEN --repo "$GITHUB_REPOSITORY" --body "$token"
          echo "Saved the rotated token."

      - name: Remove the sign-in
        if: always()
        run: rm -rf "$VELIXO_IT_CONFIG_DIR"

  notify-integration-tests-passed:
    needs: live
    if: needs.live.result == 'success'
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/send-teams-notification.yml
    with:
      title: "✅ Velixo CLI: live integration tests passed"
      branch-name: ${{ github.ref_name }}
      style: good
    secrets:
      webhook-uri: ${{ secrets.TEAMS_BUILD_NOTIFICATIONS_WEBHOOK_URI }}

  notify-integration-tests-failed:
    needs: live
    if: always() && needs.live.result == 'failure' && needs.live.outputs.sign-in-ended != 'true'
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/send-teams-notification.yml
    with:
      title: "⚠️ Velixo CLI: live integration tests failed"
      branch-name: ${{ github.ref_name }}
      style: warning
      include-error-annotations: true
    secrets:
      webhook-uri: ${{ secrets.TEAMS_BUILD_NOTIFICATIONS_WEBHOOK_URI }}

  notify-sign-in-ended:
    needs: live
    if: always() && needs.live.outputs.sign-in-ended == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/send-teams-notification.yml
    with:
      title: "🔑 Velixo CLI: the live integration tests' sign-in ended; seed VELIXO_IT_TOKEN again"
      branch-name: ${{ github.ref_name }}
      style: attention
      link-title: How to seed the token
      link-url: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/integration.yml
    secrets:
      webhook-uri: ${{ secrets.TEAMS_BUILD_NOTIFICATIONS_WEBHOOK_URI }}
