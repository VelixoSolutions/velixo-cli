# fly.toml app configuration file generated for velixo-cli-samples on 2026-10-30T18:42:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'velixo-cli-samples'
primary_region = 'yyz'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
